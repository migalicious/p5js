<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>koch layers</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  #c {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  input[type=color] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 28px;
    border: 1px solid var(--border2); border-radius: 6px;
    background: none; cursor: pointer; padding: 2px 4px;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 4px; }

  input[type=checkbox] {
    width: 14px; height: 14px;
    accent-color: var(--accent); cursor: pointer;
  }

  /* Layer rows inside panel */
  .layer-row {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .layer-row-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .layer-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    flex: 1;
  }

  .lctrl { display: flex; flex-direction: column; gap: 3px; }
  .lctrl label {
    font-size: 9px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    letter-spacing: 0.07em;
  }
  .lctrl .val { font-size: 10px; min-width: 24px; }

  .layer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px 10px;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="header">
  <h1>koch layers</h1>
  <span id="dim-badge"></span>
  <span id="status">● live</span>
</div>

<button id="toggle-panel" title="toggle controls">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
    <rect x="2" y="4" width="12" height="1.5" rx="0.75" fill="currentColor"/>
    <rect x="2" y="7.25" width="12" height="1.5" rx="0.75" fill="currentColor"/>
    <rect x="2" y="10.5" width="12" height="1.5" rx="0.75" fill="currentColor"/>
  </svg>
</button>

<div id="panel">
  <div class="panel-header">controls</div>

  <div class="section">
    <div class="section-label">global</div>
    <div class="ctrl">
      <label>background</label>
      <input type="color" id="bgColor" value="#000000">
    </div>
    <div class="ctrl">
      <label>blend mode</label>
      <select id="blendMode">
        <option value="source-over">normal</option>
        <option value="screen">screen</option>
        <option value="lighter">lighter (additive)</option>
        <option value="difference">difference</option>
        <option value="multiply">multiply</option>
        <option value="overlay">overlay</option>
      </select>
    </div>
    <div class="ctrl">
      <label>rotate °/s</label>
      <div class="ctrl-row"><input type="range" id="rotSpeed" min="0" max="60" value="0" step="1"><span class="val" id="rotSpeedV">0</span></div>
    </div>
    <div class="ctrl">
      <label>animate rotation</label>
      <div style="display:flex;align-items:center;gap:8px;padding-top:2px">
        <input type="checkbox" id="animateChk">
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">enabled</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">layers</div>
    <div id="layersList"></div>
    <button id="addLayer" style="margin-top:4px">+ add layer</button>
  </div>

  <div class="actions">
    <div class="btn-row">
      <button class="primary" id="redrawBtn">redraw<kbd>r</kbd></button>
      <button id="clearBtn">clear<kbd>c</kbd></button>
    </div>
    <div class="btn-row">
      <button id="pauseBtn">pause<kbd>space</kbd></button>
      <button id="fullscreenBtn">fullscreen<kbd>f</kbd></button>
    </div>
    <div class="section-label" style="padding-top:4px">export</div>
    <div class="ctrl">
      <label>format</label>
      <select id="exportFmt">
        <option value="image/png">png — lossless</option>
        <option value="image/jpeg" selected>jpeg — smaller</option>
        <option value="image/webp">webp — best ratio</option>
      </select>
    </div>
    <div class="ctrl" id="qualityCtrl">
      <label>quality % <span style="font-size:9px;color:var(--text-dim)">(jpeg/webp only)</span></label>
      <div class="ctrl-row"><input type="range" id="exportQuality" min="60" max="100" value="93" step="1"><span class="val" id="exportQualityV">93</span></div>
    </div>
    <div class="btn-row">
      <button class="export-btn" id="exportBtn">save image ↓</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const dimBadge = document.getElementById('dim-badge');

let W, H, DPR;

function resizeCanvas() {
  DPR = window.devicePixelRatio || 1;
  W   = window.innerWidth;
  H   = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(DPR, DPR);
  dimBadge.textContent = `${canvas.width}×${canvas.height}`;
  redraw(globalRotation);
}

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resizeCanvas, 200); });

// ── Koch expand ──
function expandKoch(axiom, rules, n) {
  let s = axiom;
  for (let i = 0; i < n; i++) {
    let ns = '';
    for (const c of s) ns += (rules[c] || c);
    s = ns;
    if (s.length > 300000) break;
  }
  return s;
}

function drawLSystem(offCtx, str, x, y, len, startAngle, angleDeg, color, alpha, lineW) {
  const angle = angleDeg * Math.PI / 180;
  let cx = x, cy = y, dir = startAngle;
  const stack = [];
  offCtx.strokeStyle = color;
  offCtx.globalAlpha = alpha;
  offCtx.lineWidth = lineW;
  offCtx.lineCap = 'round';
  offCtx.beginPath();
  offCtx.moveTo(cx, cy);
  for (const c of str) {
    if (c === 'F') {
      const nx = cx + Math.cos(dir) * len, ny = cy + Math.sin(dir) * len;
      offCtx.lineTo(nx, ny);
      cx = nx; cy = ny;
    } else if (c === '+') { dir += angle; }
    else if (c === '-') { dir -= angle; }
    else if (c === '[') { stack.push({cx,cy,dir}); }
    else if (c === ']') { const s=stack.pop(); cx=s.cx; cy=s.cy; dir=s.dir; offCtx.moveTo(cx,cy); }
  }
  offCtx.stroke();
}

function parseRules(str) {
  const rules = {};
  for (const part of str.split(',')) {
    const [k, v] = part.split(':');
    if (k && v) rules[k.trim()] = v.trim();
  }
  return rules;
}

function computeLayerLen(iters, scale) {
  return (Math.min(W, H) / 2) * (scale / 100) * Math.pow(1/3, iters - 1) * 3;
}

// ── Layer config ──
const defaultLayers = [
  { iters: 4, angle: 60, scale: 78, color: '#a78bfa', alpha: 0.85, lineW: 1.2, rotation: 0,  axiom: 'F++F++F', rules: 'F:F-F++F-F', enabled: true },
  { iters: 3, angle: 60, scale: 55, color: '#38bdf8', alpha: 0.55, lineW: 0.8, rotation: 30, axiom: 'F++F++F', rules: 'F:F-F++F-F', enabled: true },
  { iters: 5, angle: 60, scale: 38, color: '#f472b6', alpha: 0.40, lineW: 0.5, rotation: 15, axiom: 'F++F++F', rules: 'F:F-F++F-F', enabled: true },
];

let layers = defaultLayers.map(l => ({...l}));
let globalRotation = 0;
let lastTime = 0;
let paused = false;

function redraw(extraRot = 0) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = document.getElementById('bgColor').value;
  ctx.fillRect(0, 0, W, H);

  const blend = document.getElementById('blendMode').value;

  for (const layer of layers) {
    if (!layer.enabled) continue;
    const rules = parseRules(layer.rules);
    const iters = Math.min(layer.iters, 6);
    const str = expandKoch(layer.axiom, rules, iters);
    const len = computeLayerLen(iters, layer.scale);
    const totalRot = (layer.rotation + extraRot) * Math.PI / 180;
    const cx = W / 2, cy = H / 2;
    const r = (Math.min(W, H) / 2) * (layer.scale / 100) * 0.88;
    const startX = cx + Math.cos(totalRot) * r;
    const startY = cy + Math.sin(totalRot) * r;

    const offCanvas = document.createElement('canvas');
    offCanvas.width = W;
    offCanvas.height = H;
    const offCtx = offCanvas.getContext('2d');
    drawLSystem(offCtx, str, startX, startY, len, totalRot, layer.angle, layer.color, layer.alpha, layer.lineW);

    ctx.globalCompositeOperation = blend;
    ctx.globalAlpha = 1;
    ctx.drawImage(offCanvas, 0, 0, W, H);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// ── Animation loop ──
function animate(ts) {
  if (!paused && document.getElementById('animateChk').checked) {
    const dt = Math.min(ts - lastTime, 100);
    const speed = parseFloat(document.getElementById('rotSpeedV').textContent) || 0;
    globalRotation = (globalRotation + speed * dt / 1000) % 360;
    redraw(globalRotation);
  }
  lastTime = ts;
  requestAnimationFrame(animate);
}

// ── Layer UI ──
function renderLayerUI() {
  const list = document.getElementById('layersList');
  list.innerHTML = '';
  list.style.cssText = 'display:flex;flex-direction:column;gap:8px;';

  layers.forEach((layer, idx) => {
    const row = document.createElement('div');
    row.className = 'layer-row';
    row.innerHTML = `
      <div class="layer-row-top">
        <span class="layer-label">layer ${idx+1}</span>
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">
          <input type="checkbox" ${layer.enabled?'checked':''} data-idx="${idx}" class="l-enabled"> on
        </label>
        <input type="color" value="${layer.color}" data-idx="${idx}" class="l-color"
          style="width:22px;height:22px;border-radius:4px;border:1px solid var(--border2);background:none;cursor:pointer;padding:1px;flex-shrink:0">
        ${layers.length > 1 ? `<button data-idx="${idx}" class="l-remove" style="flex:0;padding:3px 8px;font-size:10px">×</button>` : ''}
      </div>
      <div class="layer-grid">
        <div class="lctrl"><label>iterations</label><div class="ctrl-row"><input type="range" min="1" max="6" value="${layer.iters}" step="1" data-idx="${idx}" class="l-iters"><span class="val l-itersV">${layer.iters}</span></div></div>
        <div class="lctrl"><label>size %</label><div class="ctrl-row"><input type="range" min="10" max="100" value="${layer.scale}" step="2" data-idx="${idx}" class="l-scale"><span class="val l-scaleV">${layer.scale}</span></div></div>
        <div class="lctrl"><label>angle °</label><div class="ctrl-row"><input type="range" min="10" max="120" value="${layer.angle}" step="1" data-idx="${idx}" class="l-angle"><span class="val l-angleV">${layer.angle}</span></div></div>
        <div class="lctrl"><label>offset °</label><div class="ctrl-row"><input type="range" min="0" max="359" value="${layer.rotation}" step="1" data-idx="${idx}" class="l-rotation"><span class="val l-rotationV">${layer.rotation}</span></div></div>
        <div class="lctrl"><label>opacity %</label><div class="ctrl-row"><input type="range" min="5" max="100" value="${Math.round(layer.alpha*100)}" step="5" data-idx="${idx}" class="l-alpha"><span class="val l-alphaV">${Math.round(layer.alpha*100)}</span></div></div>
        <div class="lctrl"><label>line width</label><div class="ctrl-row"><input type="range" min="2" max="30" value="${Math.round(layer.lineW*10)}" step="1" data-idx="${idx}" class="l-lineW"><span class="val l-lineWV">${layer.lineW.toFixed(1)}</span></div></div>
      </div>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('.l-enabled').forEach(el => el.addEventListener('change', e => {
    layers[+e.target.dataset.idx].enabled = e.target.checked; redraw(globalRotation);
  }));
  list.querySelectorAll('.l-color').forEach(el => el.addEventListener('input', e => {
    layers[+e.target.dataset.idx].color = e.target.value; redraw(globalRotation);
  }));

  const bindSlider = (cls, prop, transform, display) => {
    list.querySelectorAll('.' + cls).forEach(el => {
      const valEl = el.closest('.ctrl-row').querySelector('.' + cls + 'V');
      el.addEventListener('input', e => {
        const v = parseFloat(e.target.value);
        const idx = +e.target.dataset.idx;
        layers[idx][prop] = transform ? transform(v) : v;
        if (valEl) valEl.textContent = display ? display(v) : v;
        redraw(globalRotation);
      });
    });
  };

  bindSlider('l-iters',    'iters');
  bindSlider('l-scale',    'scale');
  bindSlider('l-angle',    'angle');
  bindSlider('l-rotation', 'rotation');
  bindSlider('l-alpha',    'alpha',  v => v/100, v => v);
  bindSlider('l-lineW',    'lineW',  v => v/10,  v => (v/10).toFixed(1));

  list.querySelectorAll('.l-remove').forEach(el => el.addEventListener('click', e => {
    layers.splice(+e.target.dataset.idx, 1);
    renderLayerUI(); redraw(globalRotation);
  }));
}

// ── Controls ──
document.getElementById('addLayer').onclick = () => {
  if (layers.length >= 6) return;
  layers.push({
    iters: 3, angle: 60, scale: 50, alpha: 0.6, lineW: 0.8,
    color: '#' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0'),
    rotation: Math.floor(Math.random()*120),
    axiom: 'F++F++F', rules: 'F:F-F++F-F', enabled: true
  });
  renderLayerUI(); redraw(globalRotation);
};

document.getElementById('redrawBtn').onclick = () => redraw(globalRotation);
document.getElementById('clearBtn').onclick  = () => {
  ctx.fillStyle = document.getElementById('bgColor').value;
  ctx.fillRect(0, 0, W, H);
};

document.getElementById('bgColor').addEventListener('input', () => redraw(globalRotation));
document.getElementById('blendMode').addEventListener('change', () => redraw(globalRotation));

const rotSpeedEl = document.getElementById('rotSpeed');
rotSpeedEl.addEventListener('input', () => {
  document.getElementById('rotSpeedV').textContent = rotSpeedEl.value;
});

// Pause
const pauseBtn = document.getElementById('pauseBtn');
pauseBtn.onclick = () => {
  paused = !paused;
  pauseBtn.innerHTML = (paused ? 'resume' : 'pause') + '<kbd>space</kbd>';
  pauseBtn.classList.toggle('active', paused);
  statusEl.textContent = paused ? '⏸ paused' : '● live';
};

// Fullscreen
const fullscreenBtn = document.getElementById('fullscreenBtn');
function updateFullscreenBtn() {
  const isFs = !!document.fullscreenElement;
  fullscreenBtn.innerHTML = (isFs ? 'exit fullscreen' : 'fullscreen') + '<kbd>f</kbd>';
}
fullscreenBtn.onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};
document.addEventListener('fullscreenchange', updateFullscreenBtn);

// Toggle panel
document.getElementById('toggle-panel').onclick = () => document.getElementById('panel').classList.toggle('hidden');

// Export
document.getElementById('exportFmt').addEventListener('change', function() {
  document.getElementById('qualityCtrl').style.opacity = this.value === 'image/png' ? '0.35' : '1';
});
const exportQualityEl = document.getElementById('exportQuality');
exportQualityEl.addEventListener('input', () => {
  document.getElementById('exportQualityV').textContent = exportQualityEl.value;
});
document.getElementById('exportBtn').onclick = () => {
  const fmt  = document.getElementById('exportFmt').value;
  const qual = parseFloat(exportQualityEl.value) / 100;
  const ext  = fmt === 'image/png' ? 'png' : fmt === 'image/jpeg' ? 'jpg' : 'webp';
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `koch_layers_${canvas.width}x${canvas.height}.${ext}`;
    a.click();
    URL.revokeObjectURL(url);
  }, fmt, qual);
};

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); pauseBtn.click(); }
  if (e.code === 'KeyF')  { e.preventDefault(); fullscreenBtn.click(); }
  if (e.code === 'KeyR')  { e.preventDefault(); document.getElementById('redrawBtn').click(); }
  if (e.code === 'KeyC')  { e.preventDefault(); document.getElementById('clearBtn').click(); }
});

// ── Init ──
resizeCanvas();
renderLayerUI();
lastTime = performance.now();
requestAnimationFrame(animate);
</script>
</body>
</html>
