<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>l-system tree</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  :root {
    /* kept for existing render logic */
    --color-background-primary: #0a0a0c;
    --color-text-primary: #e8e8f0;
  }

  #c {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="header">
  <h1>l-system tree</h1>
  <span id="dim-badge"></span>
  <span id="status">● ready</span>
</div>

<button id="toggle-panel" title="toggle controls">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
    <rect x="2" y="4" width="12" height="1.5" rx="0.75" fill="currentColor"/>
    <rect x="2" y="7.25" width="12" height="1.5" rx="0.75" fill="currentColor"/>
    <rect x="2" y="10.5" width="12" height="1.5" rx="0.75" fill="currentColor"/>
  </svg>
</button>

<div id="panel">
  <div class="panel-header">controls</div>

  <div class="section">
    <div class="section-label">preset</div>
    <div class="ctrl">
      <label>structure</label>
      <select id="preset">
        <option value="tree">tree</option>
        <option value="fern">fern</option>
        <option value="coral">coral</option>
        <option value="snowflake">snowflake (Koch)</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-label">parameters</div>
    <div class="ctrl"><label>iterations</label>
      <div class="ctrl-row"><input type="range" id="iters" min="1" max="7" value="5" step="1"><span class="val" id="itersV">5</span></div>
    </div>
    <div class="ctrl"><label>branch angle °</label>
      <div class="ctrl-row"><input type="range" id="angle" min="5" max="60" value="25" step="1"><span class="val" id="angleV">25</span></div>
    </div>
    <div class="ctrl"><label>length ratio %</label>
      <div class="ctrl-row"><input type="range" id="ratio" min="50" max="85" value="68" step="1"><span class="val" id="ratioV">68</span></div>
    </div>
    <div class="ctrl"><label>randomness</label>
      <div class="ctrl-row"><input type="range" id="rand" min="0" max="30" value="8" step="1"><span class="val" id="randV">8</span></div>
    </div>
  </div>

  <div class="actions">
    <div class="btn-row">
      <button class="primary" id="redrawBtn">redraw<kbd>r</kbd></button>
      <button id="fullscreenBtn">fullscreen<kbd>f</kbd></button>
    </div>
    <div class="section-label" style="padding-top:4px">export</div>
    <div class="ctrl">
      <label>format</label>
      <select id="exportFmt">
        <option value="image/png">png — lossless</option>
        <option value="image/jpeg" selected>jpeg — smaller</option>
        <option value="image/webp">webp — best ratio</option>
      </select>
    </div>
    <div class="ctrl" id="qualityCtrl">
      <label>quality % <span style="font-size:9px;color:var(--text-dim)">(jpeg/webp only)</span></label>
      <div class="ctrl-row"><input type="range" id="exportQuality" min="60" max="100" value="93" step="1"><span class="val" id="exportQualityV">93</span></div>
    </div>
    <div class="btn-row">
      <button class="export-btn" id="exportBtn">save image ↓</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const statusEl  = document.getElementById('status');
const dimBadge  = document.getElementById('dim-badge');

let W, H, DPR;

function resizeCanvas() {
  DPR = window.devicePixelRatio || 1;
  W   = window.innerWidth;
  H   = window.innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(DPR, DPR);
  dimBadge.textContent = `${canvas.width}×${canvas.height}`;
  render();
}

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resizeCanvas, 150); });

// ── Params ──
function param(id) {
  const el  = document.getElementById(id);
  const dsp = document.getElementById(id + 'V');
  if (dsp) { dsp.textContent = el.value; el.addEventListener('input', () => { dsp.textContent = el.value; render(); }); }
  else el.addEventListener('change', () => render());
  return () => parseFloat(el.value);
}

const getIters = param('iters');
const getAngle = param('angle');
const getRatio = param('ratio');
const getRand  = param('rand');

document.getElementById('preset').addEventListener('change', () => { syncPreset(); render(); });

// ── Presets ──
const presets = {
  tree:      { iters: 5, angle: 25, ratio: 68, rand: 8,  axiom: 'F',         rules: { F: 'F[+F]F[-F]F' } },
  fern:      { iters: 5, angle: 22, ratio: 65, rand: 3,  axiom: 'X',         rules: { X: 'F+[[X]-X]-F[-FX]+X', F: 'FF' } },
  coral:     { iters: 4, angle: 28, ratio: 70, rand: 12, axiom: 'F',         rules: { F: 'F[+F][-F]F[+F][-F]' } },
  snowflake: { iters: 4, angle: 60, ratio: 33, rand: 0,  axiom: 'F++F++F',   rules: { F: 'F-F++F-F' } },
};

function syncPreset() {
  const p = presets[document.getElementById('preset').value];
  ['iters','angle','ratio','rand'].forEach(k => {
    const el = document.getElementById(k);
    el.value = p[k];
    document.getElementById(k + 'V').textContent = p[k];
  });
}

// ── L-system expand ──
function expand(axiom, rules, n) {
  let s = axiom;
  for (let i = 0; i < n; i++) {
    let ns = '';
    for (const c of s) ns += (rules[c] || c);
    s = ns;
    if (s.length > 200000) break;
  }
  return s;
}

// ── Render ──
function setStatus(txt) { statusEl.textContent = txt; }

function render() {
  setStatus('⟳ rendering');
  requestAnimationFrame(() => {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a0a0c';
    ctx.fillRect(0, 0, W, H);

    const pname  = document.getElementById('preset').value;
    const preset = presets[pname];
    const iters   = getIters() | 0;
    const angle   = getAngle() * Math.PI / 180;
    const ratio   = getRatio() / 100;
    const randAmt = getRand() / 100;
    const str     = expand(preset.axiom, preset.rules, iters);

    // Scale base length to canvas size
    const scale = Math.min(W, H) / 420;
    const baseLen = (pname === 'snowflake' ? 140 : 90) * scale;
    let len = baseLen * Math.pow(ratio, iters - 1);

    const stack = [];
    let x = W / 2, y = H - 20 * scale, dir = -Math.PI / 2;
    if (pname === 'snowflake') { x = W * 0.15; y = H * 0.69; dir = 0; }

    ctx.strokeStyle = '#e8e8f0';
    ctx.lineWidth   = Math.max(0.3, 2.5 * Math.pow(0.7, iters));

    for (const c of str) {
      if (c === 'F') {
        const rangle = dir + (Math.random() - 0.5) * angle * randAmt * 2;
        const nx = x + Math.cos(rangle) * len;
        const ny = y + Math.sin(rangle) * len;
        ctx.globalAlpha = 0.7 + Math.random() * 0.3;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
        x = nx; y = ny;
      } else if (c === '+') { dir += angle + (Math.random() - 0.5) * angle * randAmt; }
      else if (c === '-')   { dir -= angle + (Math.random() - 0.5) * angle * randAmt; }
      else if (c === '[')   { stack.push({x, y, dir, len, lw: ctx.lineWidth}); }
      else if (c === ']') {
        const s = stack.pop();
        x = s.x; y = s.y; dir = s.dir; len = s.len;
        ctx.lineWidth = s.lw; ctx.globalAlpha = 1;
      }
      if (stack.length > 0) ctx.lineWidth = Math.max(0.3, ctx.lineWidth * 0.97);
    }
    ctx.globalAlpha = 1;
    setStatus('● ready');
  });
}

// ── Controls ──
document.getElementById('redrawBtn').onclick = render;

const fullscreenBtn = document.getElementById('fullscreenBtn');
function updateFullscreenBtn() {
  const isFs = !!document.fullscreenElement;
  fullscreenBtn.innerHTML = (isFs ? 'exit fullscreen' : 'fullscreen') + '<kbd>f</kbd>';
}
fullscreenBtn.onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};
document.addEventListener('fullscreenchange', updateFullscreenBtn);

document.getElementById('toggle-panel').onclick = () => document.getElementById('panel').classList.toggle('hidden');

// Export
document.getElementById('exportFmt').addEventListener('change', function() {
  document.getElementById('qualityCtrl').style.opacity = this.value === 'image/png' ? '0.35' : '1';
});
const exportQualityEl = document.getElementById('exportQuality');
exportQualityEl.addEventListener('input', () => {
  document.getElementById('exportQualityV').textContent = exportQualityEl.value;
});
document.getElementById('exportBtn').onclick = () => {
  const fmt  = document.getElementById('exportFmt').value;
  const qual = parseFloat(exportQualityEl.value) / 100;
  const ext  = fmt === 'image/png' ? 'png' : fmt === 'image/jpeg' ? 'jpg' : 'webp';
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a   = document.createElement('a');
    a.href     = url;
    a.download = `lsystem_tree_${canvas.width}x${canvas.height}.${ext}`;
    a.click();
    URL.revokeObjectURL(url);
  }, fmt, qual);
};

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'KeyR') { e.preventDefault(); render(); }
  if (e.code === 'KeyF') { e.preventDefault(); fullscreenBtn.click(); }
});

// ── Init ──
syncPreset();
resizeCanvas();
</script>
</body>
</html>
