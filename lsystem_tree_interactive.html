
<style>
canvas{display:block;border-radius:8px;width:100%;height:auto}
.controls{display:flex;flex-wrap:wrap;gap:10px;padding:10px 0;font-family:var(--font-sans);font-size:13px;color:var(--color-text-secondary)}
.ctrl{display:flex;flex-direction:column;gap:3px;min-width:110px}
label{font-size:11px;color:var(--color-text-tertiary)}
input[type=range]{width:100%;accent-color:var(--color-text-info,#3b82f6)}
button{padding:5px 12px;border-radius:6px;border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:12px;cursor:pointer}
button:hover{background:var(--color-background-tertiary)}
.badge{font-size:11px;padding:2px 7px;border-radius:4px;background:var(--color-background-secondary);color:var(--color-text-secondary);align-self:flex-start}
select{padding:3px 6px;border-radius:5px;border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:12px}
</style>
<canvas id="c"></canvas>
<div class="controls">
  <div class="ctrl">
    <label>preset</label>
    <select id="preset">
      <option value="tree">tree</option>
      <option value="fern">fern</option>
      <option value="coral">coral</option>
      <option value="snowflake">snowflake (Koch)</option>
    </select>
  </div>
  <div class="ctrl"><label>iterations</label><input type="range" id="iters" min="1" max="7" value="5" step="1"><span class="badge" id="itersV">5</span></div>
  <div class="ctrl"><label>branch angle °</label><input type="range" id="angle" min="5" max="60" value="25" step="1"><span class="badge" id="angleV">25</span></div>
  <div class="ctrl"><label>length ratio</label><input type="range" id="ratio" min="50" max="85" value="68" step="1"><span class="badge" id="ratioV">68</span></div>
  <div class="ctrl"><label>randomness</label><input type="range" id="rand" min="0" max="30" value="8" step="1"><span class="badge" id="randV">8</span></div>
  <div class="ctrl" style="justify-content:flex-end"><button id="redraw">redraw</button></div>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=640,H=420;
canvas.width=W;canvas.height=H;

function param(id){
  const el=document.getElementById(id),dsp=document.getElementById(id+'V');
  if(dsp){dsp.textContent=el.value;el.addEventListener('input',()=>{dsp.textContent=el.value;render();});}
  else el.addEventListener('change',()=>render());
  return ()=>parseFloat(el.value);
}
const getIters=param('iters'),getAngle=param('angle'),getRatio=param('ratio'),getRand=param('rand');
document.getElementById('preset').addEventListener('change',()=>{syncPreset();render();});

const presets={
  tree:{iters:5,angle:25,ratio:68,rand:8,axiom:'F',rules:{F:'F[+F]F[-F]F'}},
  fern:{iters:5,angle:22,ratio:65,rand:3,axiom:'X',rules:{X:'F+[[X]-X]-F[-FX]+X',F:'FF'}},
  coral:{iters:4,angle:28,ratio:70,rand:12,axiom:'F',rules:{F:'F[+F][-F]F[+F][-F]'}},
  snowflake:{iters:4,angle:60,ratio:33,rand:0,axiom:'F++F++F',rules:{F:'F-F++F-F'}}
};

function syncPreset(){
  const p=presets[document.getElementById('preset').value];
  ['iters','angle','ratio','rand'].forEach(k=>{
    const el=document.getElementById(k);
    el.value=p[k];
    document.getElementById(k+'V').textContent=p[k];
  });
}

function expand(axiom,rules,n){
  let s=axiom;
  for(let i=0;i<n;i++){
    let ns='';
    for(const c of s) ns+=(rules[c]||c);
    s=ns;
    if(s.length>200000) break;
  }
  return s;
}

function render(){
  ctx.clearRect(0,0,W,H);
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--color-background-primary')||'#fff';
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  
  const pname=document.getElementById('preset').value;
  const preset=presets[pname];
  const iters=getIters()|0, angle=getAngle()*Math.PI/180, ratio=getRatio()/100, randAmt=getRand()/100;
  const str=expand(preset.axiom,preset.rules,iters);
  
  const baseLen=pname==='snowflake'?140:90;
  let len=baseLen*Math.pow(ratio,iters-1);
  
  const stack=[];
  let x=W/2, y=H-20, dir=-Math.PI/2;
  if(pname==='snowflake'){x=100;y=H/2+80;dir=0;}
  
  const textColor=getComputedStyle(document.documentElement).getPropertyValue('--color-text-primary')||'#222';
  ctx.strokeStyle=textColor;
  ctx.lineWidth=Math.max(0.3,2.5*Math.pow(0.7,iters));
  
  for(const c of str){
    if(c==='F'){
      const rangle=dir+(Math.random()-0.5)*angle*randAmt*2;
      const nx=x+Math.cos(rangle)*len, ny=y+Math.sin(rangle)*len;
      ctx.globalAlpha=0.7+Math.random()*0.3;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.stroke();
      x=nx;y=ny;
    } else if(c==='+') dir+=angle+(Math.random()-0.5)*angle*randAmt;
    else if(c==='-') dir-=angle+(Math.random()-0.5)*angle*randAmt;
    else if(c==='[') stack.push({x,y,dir,len,lw:ctx.lineWidth});
    else if(c===']'){
      const s=stack.pop();
      x=s.x;y=s.y;dir=s.dir;len=s.len;
      ctx.lineWidth=s.lw; ctx.globalAlpha=1;
    }
    else if(c==='X'){}
    if(stack.length>0) ctx.lineWidth=Math.max(0.3,ctx.lineWidth*0.97);
  }
}

syncPreset();render();
document.getElementById('redraw').onclick=render;
</script>
